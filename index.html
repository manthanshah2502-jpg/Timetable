<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Daily topic and study planner">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Daily Topic Planner</title>
  <style>
    :root { --accent:#4f46e5; --bg:#f5f7fb; --card:#fff; --text:#182033; --muted:#6b7280; --border:#e5e7eb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { width:min(760px, calc(100% - 28px)); margin:0 auto; padding:28px 0 40px; }
    header { margin-bottom:20px; }
    h1 { margin:0 0 5px; font-size:clamp(28px,7vw,40px); }
    .sub { color:var(--muted); margin:0; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px; margin-bottom:16px; box-shadow:0 5px 20px rgba(20,30,60,.05); }
    label { display:block; font-weight:700; margin-bottom:8px; }
    input[type=date], input[type=text] { width:100%; min-height:48px; border:1px solid var(--border); border-radius:12px; padding:10px 13px; font-size:16px; background:#fff; color:var(--text); outline:none; }
    input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,70,229,.12); }
    .date-row { display:grid; grid-template-columns:1fr auto; gap:12px; align-items:end; }
    .day { min-width:120px; padding:12px 14px; border-radius:12px; background:#eef2ff; color:#3730a3; font-weight:800; text-align:center; }
    .add { display:grid; grid-template-columns:1fr auto; gap:10px; margin-top:14px; }
    button { min-height:46px; border:0; border-radius:12px; padding:10px 17px; font-size:15px; font-weight:750; cursor:pointer; }
    .primary { background:var(--accent); color:#fff; }
    .secondary { background:#eef2ff; color:#3730a3; }
    .danger { background:#fee2e2; color:#991b1b; }
    button:active { transform:translateY(1px); }
    .list-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
    .list-head h2 { margin:0; font-size:20px; }
    .count { color:var(--muted); font-size:14px; }
    ul { list-style:none; padding:0; margin:0; }
    li { display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--border); }
    li:last-child { border-bottom:0; }
    .check { width:23px; height:23px; accent-color:var(--accent); flex:0 0 auto; }
    .topic { flex:1; min-width:0; overflow-wrap:anywhere; }
    li.done .topic { text-decoration:line-through; color:var(--muted); }
    .remove { min-height:38px; padding:7px 10px; font-size:13px; }
    .empty { text-align:center; color:var(--muted); padding:24px 8px; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .hint { font-size:13px; color:var(--muted); margin-top:10px; }
    @media(max-width:520px){ .date-row,.add { grid-template-columns:1fr; } .day { width:100%; } }
  </style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Daily Topic Planner</h1>
    <p class="sub">Choose a date, add your topics, and tick them off as you finish.</p>
  </header>

  <section class="card">
    <label for="date">Select date</label>
    <div class="date-row">
      <input id="date" type="date">
      <div id="day" class="day" aria-live="polite">—</div>
    </div>

    <div class="add">
      <input id="topicInput" type="text" maxlength="200" placeholder="Enter a topic..." aria-label="New topic">
      <button id="addBtn" class="primary" type="button">+ Add Topic</button>
    </div>
    <div class="hint">Press Enter after typing a topic to add it.</div>
  </section>

  <section class="card">
    <div class="list-head">
      <h2 id="listTitle">Topics</h2>
      <span id="count" class="count"></span>
    </div>
    <ul id="topicList"></ul>
    <div id="empty" class="empty">No topics for this date yet.</div>
    <div class="actions">
      <button id="clearCompleted" class="secondary" type="button">Clear completed</button>
      <button id="clearDay" class="danger" type="button">Clear this day</button>
    </div>
  </section>
</main>

<script>
(() => {
  const dateEl = document.getElementById('date');
  const dayEl = document.getElementById('day');
  const inputEl = document.getElementById('topicInput');
  const addBtn = document.getElementById('addBtn');
  const listEl = document.getElementById('topicList');
  const emptyEl = document.getElementById('empty');
  const countEl = document.getElementById('count');
  const clearCompleted = document.getElementById('clearCompleted');
  const clearDay = document.getElementById('clearDay');

  const KEY = 'daily-topic-planner-v1';
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { data = {}; }

  function localDateString(d = new Date()) {
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function save() {
    localStorage.setItem(KEY, JSON.stringify(data));
  }

  function dayName(value) {
    if (!value) return '—';
    const [y,m,d] = value.split('-').map(Number);
    const date = new Date(y, m-1, d);
    return date.toLocaleDateString(undefined, {weekday:'long'});
  }

  function currentItems() {
    if (!data[dateEl.value]) data[dateEl.value] = [];
    return data[dateEl.value];
  }

  function render() {
    const value = dateEl.value;
    dayEl.textContent = dayName(value);
    const items = currentItems();
    listEl.innerHTML = '';

    items.forEach((item, index) => {
      const li = document.createElement('li');
      if (item.done) li.classList.add('done');

      const check = document.createElement('input');
      check.type = 'checkbox';
      check.className = 'check';
      check.checked = !!item.done;
      check.setAttribute('aria-label', `Mark ${item.text} complete`);
      check.addEventListener('change', () => {
        items[index].done = check.checked;
        save(); render();
      });

      const span = document.createElement('span');
      span.className = 'topic';
      span.textContent = item.text;

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'danger remove';
      remove.textContent = 'Remove';
      remove.addEventListener('click', () => {
        items.splice(index,1);
        save(); render();
      });

      li.append(check, span, remove);
      listEl.appendChild(li);
    });

    emptyEl.style.display = items.length ? 'none' : 'block';
    const done = items.filter(x => x.done).length;
    countEl.textContent = items.length ? `${done}/${items.length} completed` : '';
  }

  function addTopic() {
    const text = inputEl.value.trim();
    if (!text) { inputEl.focus(); return; }
    currentItems().push({text, done:false});
    save();
    inputEl.value = '';
    render();
    inputEl.focus();
  }

  dateEl.value = localDateString();
  dateEl.addEventListener('change', render);
  addBtn.addEventListener('click', addTopic);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') addTopic(); });

  clearCompleted.addEventListener('click', () => {
    const items = currentItems();
    data[dateEl.value] = items.filter(x => !x.done);
    save(); render();
  });

  clearDay.addEventListener('click', () => {
    if (!currentItems().length) return;
    if (confirm(`Delete all topics for ${dateEl.value}?`)) {
      delete data[dateEl.value];
      save(); render();
    }
  });

  render();
})();
</script>
</body>
</html>
